<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kirjakaveri</title>
    <meta name="description" content="Finnish library discovery, book search across Finland's library network, and personal reading lists manager." />
    <meta property="og:title" content="Kirjakaveri" />
    <meta property="og:description" content="Finnish library discovery, book search across Finland's library network, and personal reading lists manager." />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FAF7F2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kirjakaveri" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
      html, body {
        height: 100%;
        height: 100dvh;
        height: -webkit-fill-available;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        position: fixed;
        inset: 0;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: none;
        background-color: #FAF7F2;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-tap-highlight-color: transparent;
        letter-spacing: -0.011em;
      }
      #root {
        height: 100%;
        height: 100dvh;
        height: -webkit-fill-available;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        position: fixed;
        inset: 0;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(0, 61, 165, 0.2);
        border-radius: 4px;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Leaflet Custom Pin styling (Apple Maps Style) */
      .custom-library-marker {
        background: transparent;
        border: none;
      }
      .library-pin-wrapper {
        position: relative;
        width: 38px;
        height: 38px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .library-pin {
        background: #003DA5;
        border-radius: 50% 50% 50% 0;
        width: 34px;
        height: 34px;
        transform: rotate(-45deg);
        box-shadow: 0 4px 12px rgba(0, 61, 165, 0.35);
        cursor: pointer;
        transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid #FFFFFF;
      }
      .library-pin:hover, .library-pin.selected {
        transform: rotate(-45deg) scale(1.18);
        box-shadow: 0 0 0 4px rgba(0, 61, 165, 0.3), 0 8px 16px rgba(0, 61, 165, 0.4);
      }
      .pin-content {
        transform: rotate(45deg);
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        color: #FFFFFF;
        user-select: none;
      }
      .pin-content svg {
        width: 17px;
        height: 17px;
        stroke: #FFFFFF;
        stroke-width: 2;
        fill: none;
      }

      /* User location pulsing blue dot */
      .user-location-marker {
        background: transparent;
        border: none;
      }
      .user-pulsing-dot {
        position: relative;
        width: 22px;
        height: 22px;
      }
      .user-pulsing-dot .dot-core {
        position: absolute;
        top: 3px;
        left: 3px;
        width: 16px;
        height: 16px;
        background-color: #003DA5;
        border: 3px solid #FFFFFF;
        border-radius: 50%;
        box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        z-index: 2;
      }
      .user-pulsing-dot .dot-pulse {
        position: absolute;
        top: 0;
        left: 0;
        width: 22px;
        height: 22px;
        background-color: rgba(0, 61, 165, 0.35);
        border-radius: 50%;
        animation: user-pulse 2s infinite ease-out;
        z-index: 1;
      }
      @keyframes user-pulse {
        0% {
          transform: scale(0.8);
          opacity: 0.9;
        }
        70% {
          transform: scale(2.2);
          opacity: 0;
        }
        100% {
          transform: scale(2.2);
          opacity: 0;
        }
      }

      /* Clean Leaflet adjustments */
      .leaflet-control-attribution {
        font-size: 9px !important;
        background: rgba(255, 255, 255, 0.7) !important;
        padding: 0 4px !important;
        border-radius: 4px;
        margin: 4px !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
